#Gradle wrapper config — the wrapper JAR itself is intentionally not included
#(fetching it requires reaching services.gradle.org, which isn't possible from
#the sandbox this project was authored in). Android Studio's bundled Gradle
#will sync this project directly, or you can run `gradle wrapper` once with
#any local Gradle install to generate gradlew/gradlew.bat/gradle-wrapper.jar
#matching this distribution. See android/README.md.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
